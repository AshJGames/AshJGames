<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="100%" stop-color="#1f0933"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00f5d4" stroke-width="4" opacity="0.4"/>

  <!-- Brain Logo -->
  <g transform="translate(10, -5)" filter="url(#neon)">
    <!-- Main Brain Silhouette -->
    <path d="
      M 246 130
      C 190 90, 110 110, 100 180
      C 65 200, 55 260, 100 310
      C 80 360, 130 410, 180 400
      C 215 400, 235 380, 246 370
      C 257 380, 277 400, 312 400
      C 362 410, 412 360, 392 310
      C 437 260, 427 200, 392 180
      C 382 110, 302 90, 246 130 Z"
      fill="url(#brainGrad)"
      stroke="#ffffff"
      stroke-width="8"
    />

    <!-- Dividing Sulcus -->
    <path d="M 246 130 L 246 370" stroke="#1f0933" stroke-width="10" stroke-linecap="round"/>

    <!-- Lightning Bolt through center -->
    <polygon points="265,110 220,240 265,240 225,390 285,260 245,260" fill="#fee440" stroke="#000" stroke-width="3"/>
  </g>
</svg>
